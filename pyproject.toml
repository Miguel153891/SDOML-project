[project]
name = "sdoml-project-main"
version = "0.1.0"
description = "Software Development Oriented to Machine Learning project"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "jupyter>=1.1,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "pyarrow>=21,<22",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13,<1",
    "torch>=2.14,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
]
