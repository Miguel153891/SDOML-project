[project]
name = "sdoml-project-main"
version = "0.1.0"
description = "Software Development Oriented to Machine Learning project"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "gradio>=6.28.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "plotly>=7.1.0",
    "pyarrow>=21,<22",
    "scikit-learn>=1.7,<2",
    "seaborn>=0.13,<1",
    "torch>=2.14,<3",
]

[project.scripts]
sdoml = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_project"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "app.py"
